# Detekt 配置 - Kotlin代码质量检查工具
# 开源项目：https://github.com/detekt/detekt
#
# 这个配置文件定义了代码质量检查规则
# 用于保证代码风格统一、发现潜在问题

# 构建配置
build:
  maxIssues: 0
  failFast: false
  parallel: true
  correctCodeStyle: true
  autoCorrect: true

# 全局配置
config:
  validation: true
  warningsAsErrors: false

# 格式化规则
formatting:
  LineLength:
    active: true
    maxLineLength: 120
    ignoreBackTickedIdentifier: false
  Indentation:
    active: true
    indentSize: 4
    continuationIndentSize: 4
    tabSize: 4
  SpacingAroundColon:
    active: true
  SpacingAroundComma:
    active: true
  SpacingAroundOperators:
    active: true
  SpacingAroundRangeOperator:
    active: true
  SpacingAfterKeyword:
    active: true
  SpacingAfterComma:
    active: true
  AnnotationSpacing:
    active: true

# 性能优化规则
performance:
  ArrayPrimitiveWrapperInCollection:
    active: true
  UnnecessaryTemporaryObject:
    active: true
  UnnecessaryFilter:
    active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true

# 代码风格规则
style:
  MagicNumber:
    active: true
    excludes: [ -1, 0, 1, 2 ]
    ignoreEnums: true
    ignoreNamedArgs: true
  WildcardImport:
    active: true
    excludes: [ "kotlinx.serialization.*" ]
  VariableNaming:
    active: true
  ClassNaming:
    active: true
  FunctionNaming:
    active: true
  ReturnCount:
    active: true
    max: 5
  ComplexMethod:
    active: true
    threshold: 20
  LongParameterList:
    active: true
    threshold: 6
  MaxLineLength:
    active: true
    maxLineLength: 120
  TooManyFunctions:
    active: true
    threshold: 20
  NestedBlockDepth:
    active: true
    threshold: 6

# 空安全规则
potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  NullableToStringCall:
    active: true
  EqualsOnNull:
    active: true
  KotlinNullPointerException:
    active: true
  UndefinedDeclarationUsage:
    active: true

# 异常处理规则
exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  ThrowingNewInstanceOfSameException:
    active: true
  InstanceOfCheckForException:
    active: true

# 冗余代码规则
style:
  RedundantUnitReturnType:
    active: true
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  DuplicateCaseInWhen:
    active: true
  UnreachableCode:
    active: true

# 注释规则
comments:
  CommentOverPrivateProperty:
    active: false
  CommentOverPrivateFunction:
    active: false
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false
  DeprecatedBlockTag:
    active: true

# 空安全最佳实践
empty-blocks:
  EmptyIfBody:
    active: true
  EmptyWhenBody:
    active: true
  EmptyFunctionBlock:
    active: true
  EmptyCatchBlock:
    active: true
  EmptyTryBlock:
    active: true
  EmptyClassBlock:
    active: true
