name: Ultimate CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.4'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  MIN_SDK: '24'
  TARGET_SDK: '34'

jobs:
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Run code quality checks
        run: |
          ./gradlew lint
          ./gradlew ktlintCheck
          ./gradlew detekt
          
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
            
      - name: Check code coverage
        run: ./gradlew jacocoTestReport
        
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          fail_ci_if_error: false

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
        
      - name: Run stress tests
        run: ./gradlew testDebugUnitTest --tests "*.stress.*"
        
      - name: Run boundary tests
        run: ./gradlew testDebugUnitTest --tests "*.boundary.*"
        
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: app/build/test-results/**/*.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      firebase:
        image: google/firebase-emulator:latest
        ports:
          - 9099:9099
          - 5001:5001
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run integration tests
        run: ./gradlew connectedDebugAndroidTest
        
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-reports
          path: app/build/reports/androidTests/connected/

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Run performance tests
        run: ./gradlew :app:benchmark:benchmark
        
      - name: Upload performance reports
        uses: actions/upload-artifact@v3
        with:
          name: performance-reports
          path: |
            app/build/reports/
            app/build/outputs/performance/

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        
      - name: Upload debug APK
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
      - name: Verify APK size
        run: |
          APK_SIZE=$(du -h app/build/outputs/apk/debug/*.apk | cut -f1)
          echo "APK Size: $APK_SIZE"
          
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, integration-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Set up environment variables
        run: |
          echo "STORE_FILE=${{ secrets.STORE_FILE }}" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          
      - name: Decode keystore
        run: echo "${{ secrets.STORE_FILE }}" | base64 -d > app/release.keystore
        
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        
      - name: Upload release APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          
      - name: Upload mapping file
        uses: actions/upload-artifact@v3
        with:
          name: proguard-mapping
          path: app/build/outputs/mapping/*/mapping.txt

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-debug]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run security scan
        run: |
          ./gradlew dependencyCheckAnalyze
          ./gradlew runRiskReport
          
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: build/reports/dependency-check-report.html

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-release, security-scan]
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v3
        with:
          name: release-apk
          
      - name: Deploy to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_STAGING_APP_ID }}
          serviceCredentialsFileContent: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          groups: testers
          file: app-release.apk
          
      - name: Notify on deployment
        run: |
          echo "🚀 Successfully deployed to staging!"
          echo "Version: ${{ github.event.inputs.version || 'latest' }}"
          echo "Commit: ${{ github.sha }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-release, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v3
        with:
          name: release-apk
          
      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.appcloner
          releaseFiles: app-release.apk
          track: production
          whatsNewDirectory: whatsnew/
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          release_name: Release v${{ github.event.inputs.version || '1.0.0' }}
          draft: true
          prerelease: false
          
      - name: Notify on deployment
        run: |
          echo "🎉 Successfully deployed to production!"
          echo "Version: ${{ github.event.inputs.version || '1.0.0' }}"
          echo "Commit: ${{ github.sha }}"

  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        
      - name: Upload nightly APK
        uses: actions/upload-artifact@v3
        with:
          name: nightly-apk-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          
      - name: Run full test suite
        run: |
          ./gradlew test
          ./gradlew connectedDebugAndroidTest
          
      - name: Generate test report
        run: ./gradlew createFullTestReport
