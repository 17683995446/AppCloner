name: Build Android APK
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'
        
    - name: Grant execute permission
      run: chmod +x gradlew
      
    - name: Verify Gradle files
      run: |
        ls -la gradlew
        cat gradle/wrapper/gradle-wrapper.properties
        
    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon --stacktrace
      env:
        JAVA_OPTS: -Xmx2048m
        
    - name: Check APK output
      run: |
        echo "=== Checking APK output ==="
        ls -lh app/build/outputs/apk/debug/ || echo "No APK found in debug directory"
        find app/build -name "*.apk" -type f
        
    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-cloner-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
        
    - name: Build Summary
      if: always()
      run: |
        echo "=== Build Status ==="
        echo "APK exists: $(test -f app/build/outputs/apk/debug/app-debug.apk && echo 'YES' || echo 'NO')"
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "APK size: $(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')"
        fi
