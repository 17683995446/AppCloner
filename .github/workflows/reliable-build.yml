name: Build APK - Reliable

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: 'gradle'

    - name: Setup Gradle Build Action
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.2'
        cache-read-only: false

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Clean previous builds
      run: |
        rm -rf .gradle build app/build core/build apkprocessor/build utils/build

    - name: Build Debug APK
      id: build
      run: |
        echo "::group::Building APK"
        ./gradlew --no-daemon --stacktrace assembleDebug
        echo "::endgroup::"

    - name: List build outputs
      run: |
        echo "=== Build outputs:"
        find . -name "*.apk" -type f || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AppCloner-Debug
        path: app/build/outputs/apk/debug
        retention-days: 14
        if-no-files-found: error

    - name: Upload all build summary
      run: |
        echo '## Build Complete! 🎉' >> $GITHUB_STEP_SUMMARY
        echo '' >> $GITHUB_STEP_SUMMARY
        echo '### APK Files:' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
