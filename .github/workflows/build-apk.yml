name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      id: build_debug
      run: |
        echo "🔨 Building Debug APK..."
        gradle assembleDebug --stacktrace
        echo "✅ Debug APK built successfully"

    - name: List APK files
      run: |
        echo "📁 APK Output Directory:"
        find app/build/outputs/apk -name "*.apk" -type f || echo "No APK found"
        ls -la app/build/outputs/apk/debug/ || echo "Debug directory not found"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AppCloner-Debug-${{ github.run_number }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
        if-no-files-found: error

    - name: Build Release APK (unsigned)
      if: github.event_name == 'push'
      run: |
        echo "🔨 Building Release APK..."
        gradle assembleRelease --stacktrace || true
        echo "✅ Release build completed"

    - name: Upload Release APK
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: AppCloner-Release-${{ github.run_number }}
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: warn

    - name: Generate build summary
      run: |
        echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### APK Files" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \; >> $GITHUB_STEP_SUMMARY || echo "No APK files" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
