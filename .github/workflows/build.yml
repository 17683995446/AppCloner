name: Android CI Build
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.2
        
    - name: Grant Gradle Permission
      run: chmod +x ./gradlew
        
    - name: Verify Java and Gradle
      run: |
        echo "Java version: $(java -version)"
        echo "Gradle version: $(gradle -v | head -1)"
        
    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --warning-mode all
      env:
        JAVA_OPTS: -Xmx2048m -XX:MaxMetaspaceSize=512m
        
    - name: Verify APK Exists
      id: verify-apk
      run: |
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✅ APK build successful!"
          echo "APK size: $(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')"
          echo "apk_exists=true" >> $GITHUB_OUTPUT
        else
          echo "❌ APK not found"
          echo "apk_exists=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        
    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: AppCloner-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        compression-level: 9
        
    - name: Build Summary
      if: always()
      run: |
        echo "## 📱 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Build Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
        echo "| APK Exists | ${{ steps.verify-apk.outputs.apk_exists }} |" >> $GITHUB_STEP_SUMMARY
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "| APK Size | $(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}') |" >> $GITHUB_STEP_SUMMARY
        fi
